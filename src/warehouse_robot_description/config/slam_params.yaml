/**:
  ros__parameters:

    use_sim_time: true

    # Frames
    odom_frame: odom
    map_frame: map
    base_frame: base_link

    # Laser
    scan_topic: /scan

    mode: mapping

    resolution: 0.05
    minimum_time_interval: 0.5
    transform_publish_period: 0.02
    map_update_interval: 1.0

    enable_interactive_mode: true